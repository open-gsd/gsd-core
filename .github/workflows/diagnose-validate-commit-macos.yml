name: Diagnose validate-commit (macOS)

# #5473 — per-line cost of hooks/gsd-validate-commit.sh on the 112KB padded
# command under macOS /bin/bash 3.2, idle and under the conformance tier's
# 4-way concurrency. The report lands in the job summary. The script asserts
# nothing about the numbers but exits 1 when it cannot produce a usable trace,
# so a broken diagnostic is a red step; the loaded step still runs after a red
# idle step. It triggers only on PRs touching the diagnostic itself, or by
# hand. The in-tier half of the investigation (scripts/diagnose-validate-commit-in-tier.cjs,
# run by tests/in-tier-commit-hook-timing.test.cjs inside the macOS conformance
# job) reuses this script, so a change to either file re-runs both.
# TEMPORARY: delete this workflow, scripts/diagnose-validate-commit-phases.cjs,
# scripts/diagnose-validate-commit-in-tier.cjs, scripts/xtrace-phase-timing.cjs
# and tests/in-tier-commit-hook-timing.test.cjs once #5473 is resolved.
on:
  pull_request:
    paths:
      - 'scripts/diagnose-validate-commit-phases.cjs'
      - 'scripts/diagnose-validate-commit-in-tier.cjs'
      - 'scripts/xtrace-phase-timing.cjs'
      - '.github/workflows/diagnose-validate-commit-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: validate-commit phase timing (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: 'zsh {0}'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24

      - name: Phase timing, idle runner
        run: node scripts/diagnose-validate-commit-phases.cjs --load 0

      # always(): a broken idle step must not hide the loaded measurement.
      - name: Phase timing, 4 processes forking node (conformance-tier concurrency)
        if: always()
        run: node scripts/diagnose-validate-commit-phases.cjs --load 4
